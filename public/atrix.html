<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desarrollado por ATRIX Technologies</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(145deg, #1a1612 0%, #2c2825 50%, #3d2e1f 100%);
        color: #f5f0e8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: rgba(250, 248, 245, 0.04);
        border: 1px solid rgba(201, 169, 98, 0.35);
        border-radius: 4px;
        padding: 2.5rem 2rem;
        text-align: center;
      }
      .label {
        font-size: 0.7rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #c9a962;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        letter-spacing: 0.02em;
      }
      .brand {
        color: #c9a962;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.7;
        color: rgba(245, 240, 232, 0.75);
        margin: 1.25rem 0 2rem;
      }
      a.btn {
        display: inline-block;
        background: #c9a962;
        color: #1a1612;
        text-decoration: none;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        padding: 0.875rem 1.75rem;
        transition: background 0.2s;
      }
      a.btn:hover {
        background: #e8d5a3;
      }
      .back {
        display: block;
        margin-top: 2rem;
        font-size: 0.8rem;
        color: rgba(245, 240, 232, 0.5);
        text-decoration: none;
      }
      .back:hover {
        color: #c9a962;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="label">Sitio desarrollado por</p>
      <h1><span class="brand">ATRIX</span> Technologies</h1>
      <p>
        Desarrollo web, e-commerce y soluciones digitales a medida.
        Jon Al Parfum fue diseñado e implementado por el equipo de
        ATRIX Technologies.
      </p>
      <a class="btn" href="https://atrixnld.com" target="_blank" rel="noopener noreferrer">
        Visitar ATRIX Technologies
      </a>
      <a class="back" href="/">← Volver a Jon Al Parfum</a>
    </div>
  </body>
</html>
